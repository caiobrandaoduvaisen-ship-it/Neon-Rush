# Blueprint do Render: cria o banco PostgreSQL e o Web Service de uma vez.
databases:
  - name: neonrush3d-db
    databaseName: neonrush3d
    plan: free
services:
  - type: web
    name: neonrush3d-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: neonrush3d-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://thriving-profiterole-1bafbe.netlify.app
      - key: OWNER_ACTIVATION_CODE
        sync: false
